<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free WiFi — Library Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #edf5ee; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 34px 28px; width: 100%; max-width: 400px;
          box-shadow: 0 16px 44px rgba(23, 66, 38, 0.14); border-top: 5px solid #2f7a4a; }
  h1 { font-size: 1.35rem; color: #174226; margin-bottom: 6px; }
  p { color: #5b6f61; font-size: 0.88rem; line-height: 1.5; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 0.8rem; color: #33513f; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; padding: 13px 14px; border: 1px solid #c9dccd; border-radius: 10px;
          font-size: 1rem; outline: none; background: #f9fdf9; }
  input:focus { border-color: #2f7a4a; background: #fff; }
  button { width: 100%; padding: 14px; background: #2f7a4a; color: #fff; border: none;
           border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .footer { text-align: center; margin-top: 18px; font-size: 0.72rem; color: #8a9d90; }
</style>
</head>
<body>
<div class="card">
  <h1>Welcome to the library</h1>
  <p>Members get free Wi-Fi. Enter your name and library card number to connect.</p>
  <form method="POST" action="/portal/submit">
    <input type="hidden" name="portal_type" value="library">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="card">Library card number</label>
      <input type="text" id="card" name="card" placeholder="e.g. 123456789" inputmode="numeric" required>
    </div>
    <button type="submit">Connect to Wi-Fi</button>
  </form>
  <div class="footer">Need a card? Ask at the front desk.</div>
</div>
</body>
</html>
