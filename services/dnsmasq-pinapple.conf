interface=wlan0
bind-interfaces
dhcp-range=10.0.0.10,10.0.0.200,255.255.255.0,12h
dhcp-option=3,10.0.0.1
dhcp-option=6,10.0.0.1
# RFC 8910 captive-portal URI. Android 11+ and recent iOS/macOS use this to
# open the portal immediately; other systems still fall back to the probe
# endpoints answered by nginx. It is written to the runtime hijack file only
# while a portal/Evil Twin is active, so a normal AP does not auto-open the
# portal on every join.
dhcp-authoritative
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
log-queries
log-facility=/var/log/pinapple/dnsmasq.log

# Runtime toggle (DNS hijack) written by the dashboard. Load it explicitly:
# conf-dir=/etc/pinapple would also parse the Evil Twin's hostapd backup and
# break dnsmasq startup.
conf-file=/etc/pinapple/dnsmasq-hijack.conf
