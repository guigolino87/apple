interface=wlan0
bind-interfaces
dhcp-range=10.0.0.10,10.0.0.200,255.255.255.0,12h
dhcp-option=3,10.0.0.1
dhcp-option=6,10.0.0.1
dhcp-authoritative
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
log-queries
log-facility=/var/log/pinapple/dnsmasq.log

# Runtime toggles (DNS hijack) are written here by the dashboard.
conf-dir=/etc/pinapple,*.conf
